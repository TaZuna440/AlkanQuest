name: ipon_system
description: A gamified savings app with a Solo Leveling-inspired system interface.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.0
  path: ^1.9.0
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  flutter_svg: ^2.0.0
  lottie: ^3.1.0
  photo_view: ^0.15.0
  image_picker: ^1.0.0
  flutter_image_compress: ^2.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  uuid: ^4.4.0
  intl: ^0.20.3
  collection: ^1.18.0
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  drift_dev: ^2.28.0
  mocktail: ^1.0.0
  golden_toolkit: ^0.15.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/challenges/
    - assets/illustrations/
    - assets/animations/
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-ExtraBold.ttf
          weight: 800
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
